<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>A STORE 매장 사진</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매장사진">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" href="icon-180.png?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Black camera-app shell: logo bar on top, scrolling photo feed, shutter dock pinned to the bottom */
:root {
  --bg: #000;
  --panel: #121212;
  --panel-2: #1c1c1e;
  --line: #2a2a2c;
  --fg: #f5f5f7;
  --muted: #8e8e93;
  --stamp: #ffb43a;       /* same orange as the date printed on photos */
  --ok: #34c759;
  --err: #ff6b5e;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --dock-h: calc(116px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: clamp(14px, 3.9vw, 16px); line-height: 1.45; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, select:focus-visible + .store-pill, label:focus-visible { outline: 2px solid var(--stamp); outline-offset: 3px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gutter-r) 12px var(--gutter);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.logo { height: clamp(26px, 7vw, 32px); width: auto; display: block; }
.store { position: relative; display: block; flex: none; min-width: 0; }
.store select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.store-pill { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; padding: 8px 12px 8px 14px; border-radius: 999px; background: var(--panel-2);
  font-weight: 600; font-size: 0.94em; white-space: nowrap; max-width: 58vw; }
.store-pill span { overflow: hidden; text-overflow: ellipsis; }
.store-pill.empty { color: var(--stamp); box-shadow: inset 0 0 0 1px var(--stamp); background: transparent; }
.store-pill svg { flex: none; width: 14px; height: 14px; opacity: .7; }

/* Feed */
.feed { padding: 18px var(--gutter-r) calc(var(--dock-h) + 24px) var(--gutter); display: grid; gap: 18px;
  max-width: 720px; margin: 0 auto; }
.empty { padding: 8vh 4px 0; display: grid; gap: 28px; }
.today { font-family: var(--mono); color: var(--stamp); font-size: 0.85em; letter-spacing: .08em; }
.empty h1 { font-size: clamp(26px, 8vw, 34px); line-height: 1.2; margin: 6px 0 0; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; border-radius: 16px; overflow: hidden; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; background: var(--panel); padding: 14px 16px; }
.steps b { font-family: var(--mono); color: var(--muted); font-weight: 500; font-size: .9em; padding-top: 1px; }
.steps p { margin: 0; } .steps small { color: var(--muted); display: block; font-size: .85em; margin-top: 2px; }

.shot { position: relative; border-radius: 18px; overflow: hidden; background: var(--panel); }
.shot img { display: block; width: 100%; height: auto; -webkit-touch-callout: default; }
.shot .bar { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.shot .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.shot .fname { font-size: .85em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot .size { font-family: var(--mono); font-size: .82em; font-variant-numeric: tabular-nums; }
.shot .size s { color: var(--muted); } .shot .size em { font-style: normal; color: var(--ok); margin-left: 6px; }
.save { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: var(--fg); color: #000;
  font-weight: 700; font-size: .92em; }
.save svg { width: 16px; height: 16px; }
.save.done { background: var(--panel-2); color: var(--ok); }
.shot .msg { margin: 0; padding: 0 16px 12px; font-size: .82em; color: var(--err); }
.shot.busy { aspect-ratio: 4 / 3; display: grid; place-items: center; color: var(--muted); font-size: .9em;
  background: linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: var(--dock-h);
  padding: 14px var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter);
  background: linear-gradient(to top, #000 62%, rgba(0,0,0,0));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .74em; color: var(--muted); justify-self: center; }
.side .ico { width: 48px; height: 48px; border-radius: 14px; background: var(--panel-2); display: grid; place-items: center; color: var(--fg); position: relative; }
.side .ico svg { width: 22px; height: 22px; }
.side .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--stamp);
  color: #000; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.side:disabled { opacity: .35; }
.shutter { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  box-shadow: inset 0 0 0 4px var(--fg); }
.shutter i { width: 62px; height: 62px; border-radius: 50%; background: var(--fg); transition: transform .12s; }
.shutter:active i { transform: scale(.9); }
.shutter.working i { background: var(--panel-2); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.88); } }

.toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 8px); transform: translateX(-50%); z-index: 7;
  background: var(--panel-2); color: var(--fg); padding: 10px 16px; border-radius: 999px; font-size: .88em; white-space: nowrap;
  box-shadow: 0 6px 24px rgba(0,0,0,.6); }
@media (prefers-reduced-motion: reduce) { .shot.busy, .shutter.working i { animation: none; } }
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="logo.png" alt="A STORE">
  <label class="store">
    <select id="store" aria-label="점포 선택"><option value="">점포 선택</option></select>
    <span class="store-pill empty" id="storePill"><span id="storeName">점포 선택</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
  </label>
</header>

<main class="feed" id="feed">
  <section class="empty" id="empty">
    <div>
      <div class="today" id="today"></div>
      <h1>매장 사진을<br>찍어 주세요</h1>
    </div>
    <ol class="steps">
      <li><b>01</b><p>오른쪽 위에서 점포 선택<small>파일 이름에 점포명이 들어가요</small></p></li>
      <li><b>02</b><p>가운데 버튼으로 촬영<small>오른쪽 아래에 촬영 날짜가 찍혀요</small></p></li>
      <li><b>03</b><p>저장 → 이미지 저장<small>화질은 유지하고 용량은 약 1/5로 줄여요</small></p></li>
    </ol>
  </section>
</main>

<nav class="dock">
  <input type="file" id="lib" accept="image/*" multiple>
  <label class="side" for="lib">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></span>
    앨범
  </label>
  <input type="file" id="cam" accept="image/*" capture="environment">
  <label class="shutter" id="shutter" for="cam" aria-label="촬영"><i></i></label>
  <button class="side" id="saveAll" type="button" disabled>
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span class="badge" id="badge" hidden>0</span></span>
    모두 저장
  </button>
</nav>

<div class="toast" id="toast" hidden></div>

<script>
const STORES = {"브랜디드":["EM세종점","EM연수점","SFM일산점","일렉트로마트STF고양","일렉트로마트STF수원","일렉트로마트STF안성","EM전주점","EM영등포점","EM왕십리점","일렉트로마트STF하남","EM강릉점","SFM월계점","EM은평점","SFM죽전점","EM김해점","EM신제주점","EM진주점","EM창원점","EM만촌점","EM해운대점","EM목포점","EM월배점"],
"김성순 권역":["EM검단점","EM광명소하점","EM대전터미널점","EM둔산점","EM산본점","EM서수원점","EM수원점","EM수지점","EM안산고잔점","EM안양점","EM오산점","EM익산점","EM중동점","EM천안서북점","EM천안점","EM청주점","EM평촌점","EM평택점","EM풍산점","SFM군산점","SFM동탄점"],
"김정훈 권역":["EM가든5점","EM경기광주점","EM구로점","EM남양주점","EM다산점","EM명일점","EM목동점","EM별내점","EM여주점","EM용산점","EM이천점","EM자양점","EM창동점","EM청계천점","EM춘천점","EM하남점"],
"김종권 권역":["EM광산점","EM구미점","EM금정점","EM마산점","EM문현점","EM봉선점","EM사상점","EM서귀포점","EM성서점","EM순천점","EM양산점","EM여수점","EM연제점","EM울산점","EM칠성점","EM통영점","EM포항점"]};

// Output settings: long edge 3024px (iPhone 12MP short side) at JPEG quality 0.88
const MAX_EDGE = 3024, QUALITY = 0.88;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.round(b / 1024) + "KB";
const ymd = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

$("today").textContent = ymd(new Date());

// Store picker
const sel = $("store");
for (const [g, names] of Object.entries(STORES)) {
  const og = document.createElement("optgroup"); og.label = g;
  for (const n of names) { const o = document.createElement("option"); o.value = o.textContent = n; og.appendChild(o); }
  sel.appendChild(og);
}
function syncStore() {
  $("storeName").textContent = sel.value || "점포 선택";
  $("storePill").classList.toggle("empty", !sel.value);
}
sel.value = ls.get("store") || ""; syncStore();
sel.onchange = () => { ls.set("store", sel.value); syncStore(); };

// EXIF DateTimeOriginal (for album photos)
async function exifDate(file) {
  try {
    const buf = new DataView(await file.slice(0, 131072).arrayBuffer());
    if (buf.getUint16(0) !== 0xFFD8) return null;
    let p = 2;
    while (p < buf.byteLength - 4) {
      const m = buf.getUint16(p), len = buf.getUint16(p + 2);
      if (m === 0xFFE1 && buf.getUint32(p + 4) === 0x45786966) {
        const t = p + 10, le = buf.getUint16(t) === 0x4949;
        const u16 = o => buf.getUint16(t + o, le), u32 = o => buf.getUint32(t + o, le);
        const find = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return null; };
        const ex = find(u32(4), 0x8769); if (ex == null) return null;
        const exif = u32(ex + 8);
        const d = find(exif, 0x9003) ?? find(exif, 0x9004); if (d == null) return null;
        const off = u32(d + 8); let s = "";
        for (let i = 0; i < 19; i++) s += String.fromCharCode(buf.getUint8(t + off + i));
        const mm = s.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return mm ? new Date(+mm[1], mm[2] - 1, +mm[3], +mm[4], +mm[5], +mm[6]) : null;
      }
      if ((m & 0xFF00) !== 0xFF00) return null;
      p += 2 + len;
    }
  } catch {}
  return null;
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}

// Halve repeatedly before the final resize: keeps fine detail sharp on iPhone Safari
function resize(img, w, h) {
  let src = img, sw = img.naturalWidth, sh = img.naturalHeight;
  while (sw / 2 >= w) {
    const t = document.createElement("canvas"); t.width = Math.round(sw / 2); t.height = Math.round(sh / 2);
    const g = t.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(src, 0, 0, t.width, t.height);
    if (src !== img) { src.width = src.height = 0; }
    src = t; sw = t.width; sh = t.height;
  }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(src, 0, 0, w, h);
  if (src !== img) { src.width = src.height = 0; }
  return c;
}

async function processPhoto(file, fromCamera) {
  const taken = (fromCamera ? null : await exifDate(file)) || (fromCamera ? new Date() : new Date(file.lastModified || Date.now()));
  const { img, url } = await loadImage(file);
  const w0 = img.naturalWidth, h0 = img.naturalHeight, s = Math.min(1, MAX_EDGE / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const c = resize(img, w, h);
  URL.revokeObjectURL(url);

  const g = c.getContext("2d"), fs = Math.round(Math.max(w, h) * 0.022), m = Math.round(fs * 0.8);
  g.font = `600 ${fs}px "Helvetica Neue", Arial, sans-serif`;
  g.textAlign = "right"; g.textBaseline = "bottom";
  g.shadowColor = "rgba(0,0,0,.75)"; g.shadowBlur = fs * 0.25; g.shadowOffsetY = fs * 0.05;
  g.fillStyle = "#ffb43a";
  g.fillText(ymd(taken), w - m, h - m);

  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", QUALITY));
  c.width = c.height = 0;
  const stamp = `${taken.getFullYear()}${pad(taken.getMonth() + 1)}${pad(taken.getDate())}_${pad(taken.getHours())}${pad(taken.getMinutes())}${pad(taken.getSeconds())}`;
  return { blob, filename: `${sel.value || "매장사진"}_${stamp}.jpg`, before: file.size, w, h };
}

// Saving: iOS share sheet ("이미지 저장" → 사진 앱), else plain download
const shareOK = files => { try { return !!(navigator.canShare && navigator.canShare({ files })); } catch { return false; } };
async function saveFiles(items) {
  const files = items.map(r => new File([r.blob], r.filename, { type: "image/jpeg" }));
  if (shareOK(files)) { await navigator.share({ files }); return; }
  for (const r of items) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(r.blob); a.download = r.filename;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(z => setTimeout(z, 300));
  }
}

const shots = [];
function updateSaveAll() {
  const left = shots.filter(s => !s.saved).length;
  $("saveAll").disabled = left === 0;
  $("badge").hidden = left === 0; $("badge").textContent = left;
}
let toastT;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
function markSaved(list) { for (const s of list) { s.saved = true; s.btn.classList.add("done"); s.btn.lastChild.textContent = "저장됨"; } updateSaveAll(); }

const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';

function addCard(r) {
  const el = document.createElement("article"); el.className = "shot";
  const pct = Math.max(0, Math.round((1 - r.blob.size / r.before) * 100));
  el.innerHTML = `<img alt=""><div class="bar"><div class="info"><span class="fname"></span>
    <span class="size"><s>${fmtSize(r.before)}</s> → ${fmtSize(r.blob.size)}<em>−${pct}%</em></span></div>
    <button class="save" type="button">${ICON_DL}<span>저장</span></button></div><p class="msg" hidden></p>`;
  el.querySelector("img").src = URL.createObjectURL(r.blob);
  el.querySelector(".fname").textContent = r.filename;
  const s = { ...r, saved: false, btn: el.querySelector(".save") };
  s.btn.onclick = async () => {
    const msg = el.querySelector(".msg"); msg.hidden = true;
    try { await saveFiles([s]); markSaved([s]); }
    catch (e) { if (e?.name !== "AbortError") { msg.textContent = "저장하지 못했어요. 사진을 길게 눌러 '사진 앱에 저장'을 고르세요."; msg.hidden = false; } }
  };
  shots.push(s); updateSaveAll();
  return el;
}

$("saveAll").onclick = async () => {
  const list = shots.filter(s => !s.saved); if (!list.length) return;
  try { await saveFiles(list); markSaved(list); toast(`${list.length}장 저장했어요`); }
  catch (e) { if (e?.name !== "AbortError") toast("저장하지 못했어요. 한 장씩 저장해 주세요."); }
};

let working = 0;
async function handle(files, fromCamera) {
  if (!files.length) return;
  $("empty")?.remove();
  for (const file of files) {
    working++; $("shutter").classList.add("working");
    const ph = document.createElement("div"); ph.className = "shot busy"; ph.textContent = "사진 정리 중…";
    $("feed").prepend(ph); ph.scrollIntoView({ behavior: "smooth", block: "start" });
    try { ph.replaceWith(addCard(await processPhoto(file, fromCamera))); }
    catch { ph.classList.remove("busy"); ph.style.padding = "20px"; ph.textContent = "이 사진은 처리하지 못했어요. 다시 찍어 주세요."; }
    if (--working === 0) $("shutter").classList.remove("working");
  }
}
$("cam").onchange = e => { const f = [...e.target.files]; e.target.value = ""; handle(f, true); };
$("lib").onchange = e => { const f = [...e.target.files]; e.target.value = ""; handle(f, false); };
</script>
</body>
</html>
