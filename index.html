<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>A STORE 매장 사진</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매장사진">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" href="icon-180.png?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Black camera-app shell: logo bar, today summary, project groups below; shutter dock pinned to bottom; full-screen camera overlay */
:root {
  --bg: #000;
  --panel: #121212;
  --panel-2: #1c1c1e;
  --panel-3: #2c2c2e;
  --line: #2a2a2c;
  --fg: #f5f5f7;
  --muted: #8e8e93;
  --stamp: #ffb43a;       /* same orange as the date printed on photos */
  --ok: #34c759;
  --err: #ff6b5e;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --sb: env(safe-area-inset-bottom, 0px);
  --st: env(safe-area-inset-top, 0px);
  --dock-h: calc(112px + var(--sb));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: clamp(14px, 3.9vw, 16px); line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, label:focus-visible, input:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
svg { display: block; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding: calc(var(--st) + 12px) var(--gutter-r) 12px var(--gutter);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.logo { height: clamp(26px, 7vw, 32px); width: auto; display: block; }
.store { position: relative; display: block; flex: none; }
.store select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.store-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 14px; border-radius: 999px; background: var(--panel-2);
  font-weight: 600; font-size: .94em; white-space: nowrap; max-width: 58vw; }
.store-pill span { overflow: hidden; text-overflow: ellipsis; }
.store-pill.unset { color: var(--stamp); box-shadow: inset 0 0 0 1px var(--stamp); background: transparent; }
.store-pill svg { flex: none; width: 14px; height: 14px; opacity: .7; }
.top-actions { display:flex; align-items:center; gap:8px; }
.settings-btn { flex:none; width:38px; height:38px; border-radius:12px; background:var(--panel-2); display:grid; place-items:center; }
.settings-btn svg { width:19px; height:19px; }

/* Main */
.main { max-width: 760px; margin: 0 auto; padding: 22px var(--gutter-r) calc(var(--dock-h) + 28px) var(--gutter); display: grid; gap: 22px; }
.hero { display: grid; gap: 6px; padding: 4px 2px 0; }
.today { font-family: var(--mono); color: var(--stamp); font-size: .85em; letter-spacing: .08em; }
.hero h1 { font-size: clamp(26px, 8vw, 34px); line-height: 1.2; margin: 0; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
.hero p { margin: 4px 0 0; color: var(--muted); font-size: .92em; }

.toolbar { position: sticky; top: calc(var(--st) + 61px); z-index: 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 0; background: var(--bg); }
.toolbar .count { flex: 1; min-width: 0; font-weight: 600; }
.toolbar .count small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--panel-2); font-size: .86em; font-weight: 600; white-space: nowrap; }
.chip.danger { color: var(--err); }
.chip:disabled { opacity: .35; }
.newproj { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; border: 1px dashed var(--panel-3);
  color: var(--muted); font-weight: 600; }
.newproj svg { width: 18px; height: 18px; }

.groups { display: grid; gap: 26px; }
.group { display: grid; gap: 10px; }
.ghead { display: flex; align-items: center; gap: 10px; }
.gcheck { flex: none; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--panel-3); display: grid; place-items: center; }
.gcheck.on { background: var(--stamp); box-shadow: none; color: #000; }
.gcheck.part { box-shadow: inset 0 0 0 2px var(--stamp); }
.gcheck svg { width: 15px; height: 15px; opacity: 0; } .gcheck.on svg { opacity: 1; }
.gname { flex: 1; min-width: 0; font: inherit; font-size: 1.08em; font-weight: 700; color: var(--fg); background: transparent; border: 0; padding: 6px 2px;
  border-bottom: 1px solid transparent; border-radius: 0; letter-spacing: -0.01em; }
.gname::placeholder { color: var(--fg); opacity: 1; }
.gname:focus { outline: none; border-bottom-color: var(--stamp); }
.gname:focus::placeholder { color: var(--muted); }
.gdate { flex: none; font-family: var(--mono); font-size: .82em; color: var(--muted); font-variant-numeric: tabular-nums; }
.gdate.is-today { color: var(--stamp); }
.gadd { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; }
.gadd svg { width: 18px; height: 18px; }
.gmeta { font-size: .8em; color: var(--muted); margin: -4px 0 0 36px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 14px; overflow: hidden; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.thumb { position: relative; aspect-ratio: 1; background: var(--panel); overflow: hidden; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .15s, opacity .15s; pointer-events: none; }
.thumb .tick { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.9), 0 0 0 1px rgba(0,0,0,.25);
  background: rgba(0,0,0,.15); display: grid; place-items: center; color: #000; }
.thumb .tick svg { width: 13px; height: 13px; opacity: 0; }
.thumb.sel .tick { background: var(--stamp); box-shadow: 0 0 0 2px #000; } .thumb.sel .tick svg { opacity: 1; }
.thumb.sel img { transform: scale(.9); border-radius: 8px; }
.thumb .saved { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.6); color: var(--ok); }
.thumb.pending img { opacity: .4; }

.emptylist { padding: 26px 18px; border-radius: 16px; background: var(--panel); display: grid; gap: 10px; }
.emptylist ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); }
.emptylist b { color: var(--fg); font-weight: 600; }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: var(--dock-h);
  padding: 12px var(--gutter-r) var(--sb) var(--gutter); background: linear-gradient(to top, #000 64%, rgba(0,0,0,0));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .74em; color: var(--muted); justify-self: center; cursor: pointer; }
.side .ico { width: 48px; height: 48px; border-radius: 14px; background: var(--panel-2); display: grid; place-items: center; color: var(--fg); position: relative; }
.side .ico svg { width: 22px; height: 22px; }
.side.primary .ico { background: var(--fg); color: #000; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--stamp);
  color: #000; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.side:disabled { opacity: .35; }
.shutter { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; box-shadow: inset 0 0 0 4px var(--fg); }
.shutter i { width: 62px; height: 62px; border-radius: 50%; background: var(--fg); transition: transform .1s; }
.shutter:active i { transform: scale(.88); }

/* Camera overlay */
.cam { position: fixed; inset: 0; z-index: 20; background: #000; display: grid; grid-template-rows: auto 1fr auto; }
.cam-top { padding: calc(var(--st) + 10px) var(--gutter-r) 10px var(--gutter); display: flex; align-items: center; gap: 10px; z-index: 2; }
.cam-proj { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: rgba(28,28,30,.85); border-radius: 12px; padding: 4px 6px 4px 12px; }
.cam-proj span { font-size: .75em; color: var(--stamp); font-weight: 700; white-space: nowrap; }
.cam-proj input { flex: 1; min-width: 0; font: inherit; font-weight: 600; color: var(--fg); background: transparent; border: 0; padding: 6px 0; }
.cam-proj input::placeholder { color: var(--fg); opacity: .9; }
.cam-proj input:focus { outline: none; } .cam-proj input:focus::placeholder { color: var(--muted); }
.cam-native { flex: none; font-size: .68em; line-height: 1.15; text-align: center; color: var(--fg); background: rgba(28,28,30,.85);
  border-radius: 12px; padding: 7px 9px; cursor: pointer; font-weight: 600; }
.cam-x { width: 40px; height: 40px; border-radius: 50%; background: rgba(28,28,30,.85); display: grid; place-items: center; flex: none; }
.cam-x svg { width: 18px; height: 18px; }
.viewport { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 0; }
.viewport video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.cam-msg { position: absolute; inset: auto 16px 50% 16px; transform: translateY(50%); text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
.cam-msg .chip { color: var(--fg); }
.res { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,.55); }
.cam-bottom { padding: 10px var(--gutter-r) calc(var(--sb) + 14px) var(--gutter); display: grid; gap: 14px; }
.tray { display: flex; gap: 6px; overflow-x: auto; min-height: 56px; scrollbar-width: none; padding: 2px 0; }
.tray::-webkit-scrollbar { display: none; }
.tray img { flex: none; width: 52px; height: 52px; object-fit: cover; border-radius: 8px; background: var(--panel-2); }
.tray .hint { color: var(--muted); font-size: .82em; align-self: center; }
.cam-ctrl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.cam-count { justify-self: center; font-family: var(--mono); font-size: .9em; color: var(--muted); text-align: center; line-height: 1.2; }
.cam-count b { display: block; color: var(--fg); font-size: 1.5em; font-family: var(--font); }
.done { justify-self: center; padding: 12px 22px; border-radius: 999px; background: var(--stamp); color: #000; font-weight: 800; }
/* Landscape: video fills the left, controls move to a column on the right (like the iPhone camera) */
@media (orientation: landscape) and (max-height: 600px) {
  .cam { grid-template-columns: 1fr auto; grid-template-rows: 1fr; }
  .viewport { grid-column: 1; grid-row: 1; }
  .cam-top { position: absolute; top: 0; left: 0; right: 120px; padding: calc(var(--st) + 8px) 8px 8px var(--gutter); }
  .cam-proj { max-width: 340px; }
  .cam-bottom { grid-column: 2; grid-row: 1; width: calc(112px + env(safe-area-inset-right, 0px)); min-height: 0;
    padding: calc(var(--st) + 8px) max(10px, env(safe-area-inset-right, 0px)) calc(var(--sb) + 8px) 10px;
    display: flex; flex-direction: column; gap: 10px; background: #000; }
  .tray { flex: 1; min-height: 0; flex-direction: column; align-items: center; overflow-x: hidden; overflow-y: auto; }
  .tray .hint { font-size: .72em; text-align: center; }
  .cam-ctrl { grid-template-columns: none; grid-template-rows: auto auto auto; justify-items: center; gap: 10px; }
  .cam-count { display: flex; gap: 3px; align-items: baseline; } .cam-count b { display: inline; font-size: 1.25em; }
  .shutter { width: 70px; height: 70px; } .shutter i { width: 56px; height: 56px; }
  .done { padding: 9px 18px; }
  .res { left: auto; right: 10px; }
}
.flyer { position: fixed; z-index: 30; object-fit: cover; pointer-events: none; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }

/* Sheet + viewer + toast */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: grid; align-items: end; }
.sheet { background: var(--panel-2); border-radius: 20px 20px 0 0; padding: 22px var(--gutter-r) calc(var(--sb) + 18px) var(--gutter); display: grid; gap: 14px; }
.sheet h2 { margin: 0; font-size: 1.15em; } .sheet p { margin: 0; color: var(--muted); }
.sheet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.sheet .btns button { padding: 14px; border-radius: 14px; background: var(--panel-3); font-weight: 700; }
.sheet .btns .del { background: var(--err); color: #000; }
.viewer { position: fixed; inset: 0; z-index: 35; background: #000; display: grid; grid-template-rows: auto 1fr auto; }
.viewer .vtop { padding: calc(var(--st) + 10px) var(--gutter-r) 10px var(--gutter); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.viewer .vname { font-size: .85em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.viewer .vimg { min-height: 0; display: grid; place-items: center; }
.viewer .vimg img { max-width: 100%; max-height: 100%; object-fit: contain; -webkit-touch-callout: default; }
.viewer .vbot { padding: 12px var(--gutter-r) calc(var(--sb) + 14px) var(--gutter); display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: .82em; color: var(--muted); gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 8px); transform: translateX(-50%); z-index: 50;
  background: var(--panel-3); color: var(--fg); padding: 10px 16px; border-radius: 999px; font-size: .88em; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
@media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }
/* Search sheet follows the visual viewport when the phone keyboard opens. */
#storeSheet { bottom:auto; top:var(--search-top, 0px); height:var(--search-height, 100dvh); }
.store-sheet { max-height:100%; min-height:0; grid-template-rows:auto auto minmax(0, 1fr) auto; }
#storeSearch { width:100%; min-width:0; font:inherit; font-size:16px; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
.store-results { overflow-y:auto; overscroll-behavior:contain; min-height:0; max-height:55dvh; }
.store-results h3 { color:var(--muted); font-size:.82em; margin:14px 0 6px; }
.store-result { display:block; width:100%; text-align:left; padding:12px; border-radius:10px; }
.store-result[aria-current="true"] { color:var(--stamp); background:var(--panel-3); }
/* Headquarters collection */
.hq-list, .hq-card { display:grid; gap:12px; }
.hq-card { background:var(--panel); border-radius:18px; padding:16px; }
.hq-card.paused { background:var(--panel-2); color:var(--muted); }
.hq-card.paused .hq-tile { filter:grayscale(1); opacity:.55; }
.hq-card h2, .hq-card h3 { margin:0; font-size:1.05em; }
.hq-card h3 { font-size:.88em; color:var(--muted); }
.hq-meta, .hq-hint, .hq-progress { color:var(--muted); font-size:.82em; margin:0; }
.hq-progress { color:var(--stamp); }
.hq-tile { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--panel-3) center/cover; display:flex; flex-direction:column; justify-content:end; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; cursor:pointer; }
.hq-tile.empty { align-items:center; justify-content:center; gap:8px; padding:8px; text-align:center; color:var(--muted); }
.hq-tile svg { width:26px; height:26px; }
.hq-tile.requested, .hq-tile.error { box-shadow:inset 0 0 0 2px var(--err); }
.hq-caption { padding:5px 7px; background:rgba(0,0,0,.75); font-size:.72em; overflow-wrap:anywhere; pointer-events:none; }
.hq-tile.requested .hq-caption, .hq-tile.error .hq-caption, .thumb .send-error { color:var(--err); }
.thumb .sent { bottom:auto; top:6px; color:var(--stamp); }
#hqConfirm .confirm { background:var(--stamp); color:#000; }
#camSlot { position:absolute; top:8px; left:12px; right:12px; text-align:center; color:var(--stamp); background:rgba(0,0,0,.65); border-radius:10px; padding:6px; pointer-events:none; }
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="logo.png" alt="A STORE">
  <div class="top-actions">
    <div class="store">
      <select id="store" aria-label="점포 선택" hidden><option value="">점포 선택</option></select>
      <button type="button" class="store-pill unset" id="storePill" aria-haspopup="dialog"><span id="storeName">점포 선택</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <button class="settings-btn" id="settingsBtn" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></svg>
    </button>
  </div>
</header>

<main class="main">
  <section class="hero">
    <div class="today" id="today"></div>
    <h1 id="heroTitle">매장 사진을<br>찍어 주세요</h1>
    <p id="heroSub">가운데 버튼을 누르면 카메라가 열리고, 여러 장을 이어서 찍을 수 있어요.</p>
  </section>

  <div id="hqProgress" class="hq-progress" role="status" hidden></div>
  <div id="hqCards" class="hq-list" hidden></div>

  <div class="toolbar" id="toolbar" hidden>
    <span class="count" id="selCount"></span>
    <button class="chip" id="selToday" type="button">오늘 전체</button>
    <button class="chip" id="selAll" type="button">전체 선택</button>
    <button class="chip danger" id="delBtn" type="button">삭제</button>
  </div>

  <button class="newproj" id="newProj" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    새 프로젝트로 촬영
  </button>

  <div class="groups" id="groups"></div>
  <p id="hqHint" class="hq-hint" hidden>홈 화면에 추가하면 본사 취합을 쓸 수 있어요</p>
</main>

<nav class="dock">
  <input type="file" id="lib" accept="image/*" multiple>
  <label class="side" for="lib">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></span>
    앨범
  </label>
  <button class="shutter" id="openCam" type="button" aria-label="카메라 열기"><i></i></button>
  <button class="side primary" id="saveBtn" type="button" disabled>
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span class="badge" id="badge" hidden>0</span></span>
    저장
  </button>
</nav>

<!-- Camera -->
<section class="cam" id="cam" hidden>
  <div class="cam-top">

// Output: long edge 3024px at JPEG quality 0.88; thumbnails 360px for the list
const MAX_EDGE = 3024, QUALITY = 0.88, THUMB = 360;
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';

$ ("adminPageBtn").onclick = () => window.open(SERVER + "/admin/store-photo", "_blank");
const pad = n => String(n).padStart(2, "0");
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.round(b / 1024) + "KB";
const ymd = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

else if (location.hash === "#notest") ls.set("testMode", "0");

function prettyDay(key) {
  const [y, m, d] = key.split("-").map(Number), dt = new Date(y, m - 1, d);
  const s = `${pad(m)}.${pad(d)} (${WEEK[dt.getDay()]})`;
  return y === new Date().getFullYear() ? s : `${y}.${s}`;
}
const safeName = s => s.replace(/[\\/:*?"<>|]/g, "").trim();

/* ---------- Storage (IndexedDB, stays on this phone) ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("storephoto", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("projects", { keyPath: "id" });
      d.createObjectStore("photos", { keyPath: "id" }).createIndex("project", "projectId");
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode), s = t.objectStore(store); let out;
    Promise.resolve(fn(s)).then(v => out = v);
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const all = store => tx(store, "readonly", s => new Promise(r => { const q = s.getAll(); q.onsuccess = () => r(q.result); }));
const put = (store, v) => tx(store, "readwrite", s => { s.put(v); });
const del = (store, id) => tx(store, "readwrite", s => { s.delete(id); });

/* ---------- State ---------- */
let projects = [], photos = [];
const sel = new Set();
const urls = new Map();   // photo id -> thumb object URL
const thumbURL = p => { if (!urls.has(p.id)) urls.set(p.id, URL.createObjectURL(p.thumb)); return urls.get(p.id); };

const storeSel = $("store");
let hubStores = [];
let testStore = null;
try { hubStores = JSON.parse(ls.get("hqStores") || "[]"); if (!Array.isArray(hubStores) || hubStores.some(x => !x || !x.name || x.store_id == null)) hubStores = []; } catch {}
function populateStores() {
  const selected = storeSel.value || ls.get("store") || "";
  storeSel.length = 1;
  if (testMode) {

    storeSel.appendChild(og);

  storeSel.value = selected; syncStore(); if (!$("storeSheet").hidden) renderStoreResults();
}
function syncStore() { $("storeName").textContent = storeSel.value || "점포 선택"; $("storePill").classList.toggle("unset", !storeSel.value); }
populateStores();
const normalizeStore = value => value.toLowerCase().replace(/\s+/g, "").replace(/일렉트로마트|sfm|stf|em|점/g, "");
function closeStoreSearch() { $("storeSearch").blur(); $("storeSheet").hidden = true; $("storePill").focus(); }
function renderStoreResults() {
  const root = $("storeResults"), query = normalizeStore($("storeSearch").value);
  root.textContent = ""; let count = 0;
  function add(option) {
    const button = document.createElement("button"); button.type = "button"; button.className = "store-result";
    button.textContent = option.textContent; button.setAttribute("aria-current", String(option.value === storeSel.value));
    button.onclick = () => { storeSel.value = option.value; storeSel.onchange(); closeStoreSearch(); };

  if (testMode) { const option = [...storeSel.options].find(o => o.value === "테스트점"); if (option) add(option); }
  for (const group of storeSel.querySelectorAll("optgroup")) {

    options.forEach(add);
  }
  if (!count) root.textContent = "찾는 점포가 없어요";
}

/* ---------- Image processing ---------- */
async function exifDate(file) {
  try {
    const buf = new DataView(await file.slice(0, 131072).arrayBuffer());
    if (buf.getUint16(0) !== 0xFFD8) return null;
    let p = 2;
    while (p < buf.byteLength - 4) {
      const m = buf.getUint16(p), len = buf.getUint16(p + 2);
      if (m === 0xFFE1 && buf.getUint32(p + 4) === 0x45786966) {
        const t = p + 10, le = buf.getUint16(t) === 0x4949;
        const u16 = o => buf.getUint16(t + o, le), u32 = o => buf.getUint32(t + o, le);
        const find = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return null; };
        const ex = find(u32(4), 0x8769); if (ex == null) return null;
        const exif = u32(ex + 8);
        const d = find(exif, 0x9003) ?? find(exif, 0x9004); if (d == null) return null;
        const off = u32(d + 8); let s = "";
        for (let i = 0; i < 19; i++) s += String.fromCharCode(buf.getUint8(t + off + i));
        const mm = s.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return mm ? new Date(+mm[1], mm[2] - 1, +mm[3], +mm[4], +mm[5], +mm[6]) : null;
      }
      if ((m & 0xFF00) !== 0xFF00) return null;
      p += 2 + len;
    }
  } catch {}
  return null;
}
function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { res(img); URL.revokeObjectURL(url); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
// Halve repeatedly before the final resize: keeps fine detail sharp on iPhone Safari
function resize(src, sw, sh, w, h) {
  let cur = src;
  while (sw / 2 >= w) {
    const t = document.createElement("canvas"); t.width = Math.round(sw / 2); t.height = Math.round(sh / 2);
    const g = t.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(cur, 0, 0, t.width, t.height);
    if (cur !== src && cur.width) { cur.width = cur.height = 0; }
    cur = t; sw = t.width; sh = t.height;
  }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(cur, 0, 0, w, h);
  if (cur !== src && cur.width) { cur.width = cur.height = 0; }
  return c;
}
const toBlob = (c, q) => new Promise(r => c.toBlob(r, "image/jpeg", q));

// src: image or canvas; returns stored photo record
async function makePhoto(src, sw, sh, taken, before, project, hq = null) {
  const s = Math.min(1, MAX_EDGE / Math.max(sw, sh));
  const w = Math.round(sw * s), h = Math.round(sh * s);
  const c = resize(src, sw, sh, w, h);
  const g = c.getContext("2d"), fs = Math.round(Math.max(w, h) * 0.022), m = Math.round(fs * 0.8);
  g.font = `600 ${fs}px "Helvetica Neue", Arial, sans-serif`;
  g.textAlign = "right"; g.textBaseline = "bottom";
  g.shadowColor = "rgba(0,0,0,.75)"; g.shadowBlur = fs * 0.25; g.shadowOffsetY = fs * 0.05;
  g.fillStyle = "#ffb43a"; g.fillText(ymd(taken), w - m, h - m);
  const blob = await toBlob(c, QUALITY);
  const ts = THUMB / Math.min(w, h), tc = resize(c, w, h, Math.round(w * ts), Math.round(h * ts));
  const thumb = await toBlob(tc, 0.78);
  c.width = c.height = 0; tc.width = tc.height = 0;
  const p = { id: uid(), projectId: project.id, blob, thumb, w, h, before: before || 0, taken: taken.getTime(), ts: Date.now(), saved: false, store: storeSel.value };
  if (hq) { p.hq = { ...hq }; p.sent = false; p.store = hq.storeName; if (projectPaused(hq.projectId)) p.paused = true; }
  photos.push(p); await put("photos", p);
  if (hq) { renderHQ(); sendHQ(); }
  return p;
}
async function photoFromFile(file, project, fromCamera, hq = null) {
  const taken = (fromCamera ? null : await exifDate(file)) || (fromCamera ? new Date() : new Date(file.lastModified || Date.now()));
  const img = await loadImage(file);
  return makePhoto(img, img.naturalWidth, img.naturalHeight, taken, file.size, project, hq);
}
function fileName(p) {
  const pr = projects.find(x => x.id === p.projectId), d = new Date(p.taken);
  const parts = [(p.store || storeSel.value || "매장사진").replace(/^🧪\s*/, "")];
  if (pr?.name) parts.push(safeName(pr.name));
  parts.push(`${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`);
  return parts.join("_") + ".jpg";
}

  const list = projects.map(pr => ({ pr, ph: photos.filter(p => p.projectId === pr.id).sort((a, b) => a.ts - b.ts) }))
    .filter(x => x.ph.length).sort((a, b) => (b.pr.day.localeCompare(a.pr.day)) || (b.pr.ts - a.pr.ts));
  const has = list.length > 0;
  $("toolbar").hidden = !has; $("newProj").hidden = !has;
  const todayN = photos.filter(p => projects.find(x => x.id === p.projectId)?.day === t).length;
  $("heroTitle").innerHTML = todayN ? `오늘 ${todayN}장<br>찍었어요` : "매장 사진을<br>찍어 주세요";

  if (!has) {
    g.innerHTML = `<div class="emptylist"><ol>
      <li><b>오른쪽 위에서 점포 선택</b> — 파일 이름에 들어가요</li>
      <li><b>가운데 버튼으로 연속 촬영</b> — 다 찍고 완료</li>
      <li><b>선택 후 저장</b> — 오늘 사진이 기본으로 선택돼요</li></ol></div>`;
  }

  Object.assign(f.style, { left: fromRect.left + "px", top: fromRect.top + "px", width: fromRect.width + "px", height: fromRect.height + "px" });
  document.body.appendChild(f);

  const a = f.animate([{ transform: "none", borderRadius: "4px" }, { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, borderRadius: "20px" }],

  const prev = document.createElement("canvas"); const ps = 160 / Math.min(vw, vh); prev.width = Math.round(vw * ps); prev.height = Math.round(vh * ps);

async function hqLocalProject(remote) {
  let pr = projects.find(p => same(p.hqProjectId, remote.id));
  if (!pr) { pr = { id:uid(), hqProjectId:remote.id, name:remote.name, day:todayKey(), ts:Date.now(), store:storeSel.value }; projects.push(pr); }
  pr.name = remote.name; await put("projects", pr); return pr;
}
async function beginHQ(project, slot, replacement) {
  if (projectPaused(project.id)) return toast("잠시 멈춤 중이에요");
  if (!standalone || !(await confirmStore())) return;
  if (projectPaused(project.id)) return toast("잠시 멈춤 중이에요");
  const target = { projectId:project.id, storeId:storeId(), storeName:storeSel.value, slot:slot?.key ?? null, replaceItemId:replacement?.id ?? null };
  await openCamera(await hqLocalProject(project), target);
}
function updateCamSlot() {
  const project = hqProjects.find(p => same(p.id, camHQ?.projectId));
  const slot = project?.preset?.find(s => same(s.key, camHQ?.slot));
  $("camSlot").hidden = !camHQ; $("camSlot").textContent = camHQ ? (camHQ.replaceItemId != null ? "교체 촬영 · " : "") + (slot?.name || project?.name || "본사 취합") : "";
}
function cameraBusy() {
  $("camDone").disabled = !!camHQ && !!pending;
  if (camHQ) { $("snap").disabled = !!pending || projectPaused(camHQ.projectId); $("nativeCam").disabled = !!pending || projectPaused(camHQ.projectId); }
  else { $("snap").disabled = false; $("nativeCam").disabled = false; }
}
function advanceHQ(target) {
  if (!camHQ || $("cam").hidden || !sessionPhotos.some(p => same(p.hq.slot, target.slot) && same(p.hq.replaceItemId, target.replaceItemId))) return;
  const project = hqProjects.find(p => same(p.id, target.projectId));
  if (project && target.replaceItemId == null && !project.preset?.length) return;
  const next = target.replaceItemId == null ? project?.preset?.find(s => !slotPhoto(project, s.key)) : null;
  if (next) { camHQ = { ...target, slot:next.key }; updateCamSlot(); }
  else { closeCamera(); $("hqFinish").hidden = false; }
}
function saveHQSession() {
  // Called directly by the click handler, before any await, to retain iOS user activation.
  const saving = saveList([...sessionPhotos]);
  saving.then(() => { render(); }).catch(e => { if (e?.name !== "AbortError") toast("사진첩에 저장하지 못했어요. 개인 목록에서 다시 저장해 주세요."); });
}
$("hqFinishYes").onclick = () => { saveHQSession(); $("hqFinish").hidden = true; };
$("hqFinishNo").onclick = () => { $("hqFinish").hidden = true; };
$("hqLib").onchange = async e => {
  const files = [...e.target.files], choice = albumHQ; e.target.value = ""; albumHQ = null;
  if (!choice || !standalone || !files.length) return;
  if (projectPaused(choice.project.id)) return toast("잠시 멈춤 중이에요");
  const pr = await hqLocalProject(choice.project);
  for (const f of files) {
    try { const p = await photoFromFile(f, pr, false, { projectId:choice.project.id, slot:null, storeId:choice.storeId, storeName:choice.storeName, replaceItemId:null }); sel.add(p.id); }
    catch { toast("이 사진은 처리하지 못했어요"); }
    render();
  }
};
const unsentHQ = () => photos.filter(p => p.hq && !p.sent && !p.sendError && !p.paused && !projectPaused(p.hq.projectId));
function showSendProgress() {
  $("hqProgress").hidden = !standalone || !unsentHQ().length;
  $("hqProgress").textContent = `본사로 보내는 중 ${batchDone}/${batchTotal}`;
}
async function sendHQ() {
  if (!standalone || sending) return;
  clearTimeout(retryTimer); sending = true;
  if (!batchTotal) { batchDone = 0; batchTotal = unsentHQ().length; }
  try {
    while (unsentHQ().length) {
      const p = unsentHQ()[0]; batchTotal = Math.max(batchTotal, batchDone + unsentHQ().length); showSendProgress();
      const data = new FormData();
      const fields = { store_id:p.hq.storeId, uid:p.id, device_id:deviceId, taken_at:new Date(p.taken).toISOString(), filename:fileName(p) };
      if (p.hq.replaceItemId != null) fields.item_id = p.hq.replaceItemId;
      else { fields.project_id = p.hq.projectId; if (p.hq.slot != null) fields.slot = p.hq.slot; }
      for (const [key,value] of Object.entries(fields)) data.append(key, value);
      data.append("photo", p.blob, fileName(p)); data.append("thumb", p.thumb, "thumb.jpg");
      try {
        const r = await hubFetch(`/api/store-photo/${p.hq.replaceItemId != null ? "replace" : "upload"}`, { method:"POST", body:data });
        let result; try { result = await r.json(); } catch {}
        if (r.status === 423) {
          delete p.sendError; p.paused = true;
          await pauseProject(p.hq.projectId);
          render(); cameraBusy(); continue;
        }
        if (r.status >= 400 && r.status < 500) {
          p.sendError = result?.error || "사진을 보내지 못했어요";
        } else if (!r.ok || !result?.ok) throw Error();
        else p.sent = true;
        if (photos.includes(p)) await put("photos", p);
        batchDone++; retryDelay = 2000; render(); await refreshHQ();
      } catch {
        retryTimer = setTimeout(sendHQ, retryDelay); retryDelay = Math.min(60000, retryDelay * 2); return;
      }
    }
    if (batchTotal && batchDone && !photos.some(p => p.hq && (p.sendError || p.paused))) toast("모두 보냈어요");
    batchDone = batchTotal = 0; showSendProgress();
  } finally { sending = false; applyAppUpdate(); }
}
window.addEventListener("online", () => { sendHQ(); refreshHQ(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshHQ(); checkAppVersion(); } });

/* ---------- Fresh app version; photo data remains in IndexedDB ---------- */
let nextAppVersion = null, checkingVersion = false;
function applyAppUpdate() {
  if (!nextAppVersion || !$("cam").hidden || pending || sending) return;
  try {
    if (sessionStorage.getItem("appReload:" + nextAppVersion)) return;
    sessionStorage.setItem("appReload:" + nextAppVersion, "1");
  } catch { return; } // A reload needs the session guard to avoid a cache loop.
  location.replace(location.pathname + "?v=" + encodeURIComponent(nextAppVersion) + location.hash);
}
async function checkAppVersion() {
  if (checkingVersion) return;
  checkingVersion = true;
  try {
    const response = await fetch("version.json?t=" + Date.now(), { cache:"no-store" });
    if (!response.ok) return;
    const { v } = await response.json();
    if (typeof v === "string" && v && v !== APP_VERSION) nextAppVersion = v;
    applyAppUpdate();
  } catch {} finally { checkingVersion = false; }
}
setInterval(() => { refreshHQ(); checkAppVersion(); }, 60000);

/* ---------- Boot ---------- */
(async () => {
  try {
    db = await openDB();
    [projects, photos] = await Promise.all([all("projects"), all("photos")]);
    navigator.storage?.persist?.().catch(() => {});
  } catch { toast("사진 보관함을 열 수 없어요. 개인정보 보호 모드를 꺼 주세요."); }
  defaultSelect(); render();
  checkAppVersion(); refreshHQ(); loadStores(); sendHQ();
})();
</script>
